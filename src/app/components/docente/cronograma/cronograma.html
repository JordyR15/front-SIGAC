<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Reprogramar Cronograma</h2>
    <p class="text-slate-500 text-sm mt-1">Actualiza las fechas de las actividades de tu cátedra.</p>
  </div>

  <section class="glass-card rounded-2xl p-6 max-w-2xl">
    <form (ngSubmit)="guardarCambios()" class="space-y-6">
      <!-- Selección de Actividad -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Actividad</label>
        <select [(ngModel)]="actividad.id" name="actividadId" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900">
          <option [value]="1">Examen Parcial 1</option>
          <option [value]="2">Entrega de Proyecto</option>
          <option [value]="3">Clase de Repaso</option>
        </select>
      </div>

      <!-- Nueva Fecha -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Nueva Fecha</label>
        <input type="date" [(ngModel)]="actividad.fechaPrevista" name="fechaPrevista" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900" />
      </div>

      <!-- Observación -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Motivo del Cambio</label>
        <textarea rows="3" [(ngModel)]="actividad.descripcion" name="descripcion" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900" placeholder="Ej: Se requiere más tiempo para cubrir el temario..."></textarea>
      </div>

      <button type="submit" class="py-3 px-6 bg-accent hover:bg-accent-dim text-white font-bold rounded-xl shadow-lg shadow-accent/20 transition-all transform hover:-translate-y-0.5">
        Guardar Cambios
      </button>
    </form>
  </section>
</div>
