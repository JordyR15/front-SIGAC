<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Expediente del Estudiante</h2>
    <p class="text-slate-500 text-sm mt-1">Estudiante: <strong>{{ expediente.nombreEstudiante }}</strong></p>
  </div>

  <section class="glass-card rounded-2xl p-6">
    <h3 class="text-sm font-semibold text-slate-900 mb-4">Historial Académico</h3>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
        <tr class="text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-200">
          <th class="text-left font-semibold px-4 py-2">Materia</th>
          <th class="text-right font-semibold px-4 py-2">Calificación</th>
          <th class="text-left font-semibold px-4 py-2">Periodo</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-200">
        <tr *ngFor="let h of expediente.historial">
          <td class="px-4 py-3 font-medium text-slate-900">{{ h.nombreCatedra }}</td>
          <td class="px-4 py-3 text-right font-semibold">{{ h.calificacionFinal }}</td>
          <td class="px-4 py-3 text-slate-500">{{ h.periodo }}</td>
        </tr>
        </tbody>
      </table>
    </div>

    <h3 class="text-sm font-semibold text-slate-900 mt-6 mb-4">Indicadores Cualitativos</h3>
    <div class="space-y-3">
      <div *ngFor="let i of expediente.indicadores" class="border border-slate-200 rounded-xl p-4">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-slate-900">{{ i.indicador }}</span>
          <span class="text-xs text-slate-500">{{ i.fecha }}</span>
        </div>
        <p class="text-xs text-slate-600 mt-1">{{ i.observacion }}</p>
      </div>
    </div>
  </section>
</div>
