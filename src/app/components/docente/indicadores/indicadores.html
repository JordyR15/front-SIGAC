<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Registro de Indicadores Cualitativos</h2>
    <p class="text-slate-500 text-sm mt-1">Registra observaciones sobre interés, participación o desempeño.</p>
  </div>

  <section class="glass-card rounded-2xl p-6 max-w-2xl">
    <form (ngSubmit)="registrar()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Estudiante</label>
        <select [(ngModel)]="indicador.estudianteId" name="estudianteId" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900">
          <option [value]="1">María González</option>
          <option [value]="2">Carlos Pérez</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Tipo de Indicador</label>
        <select [(ngModel)]="indicador.indicador" name="indicador" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900">
          <option value="Interés">Interés</option>
          <option value="Participación">Participación</option>
          <option value="Desempeño">Desempeño</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Observación</label>
        <textarea rows="3" [(ngModel)]="indicador.observacion" name="observacion" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900"></textarea>
      </div>
      <button type="submit" class="py-3 px-6 bg-accent hover:bg-accent-dim text-white font-bold rounded-xl shadow-lg shadow-accent/20">Registrar Indicador</button>
    </form>
  </section>
</div>
