<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">Alertas Tempranas</h2>
      <p class="text-slate-500 text-sm mt-1">Estudiantes con bajo rendimiento académico.</p>
    </div>
  </div>

  <section class="glass-card rounded-2xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
        <tr class="text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-200 bg-slate-50/50">
          <th class="text-left font-semibold px-5 md:px-6 py-3">Estudiante</th>
          <th class="text-right font-semibold px-4 py-3">Promedio</th>
          <th class="text-center font-semibold px-4 py-3">Alerta</th>
          <th class="text-right font-semibold px-5 md:px-6 py-3">Acción</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-200">
        <tr *ngFor="let a of alertas" class="hover:bg-slate-50 transition-colors">
          <td class="px-5 md:px-6 py-4 font-medium text-slate-900">{{ a.nombreEstudiante }}</td>
          <td class="px-4 py-4 text-right font-semibold text-red-600">{{ a.promedioActual }}</td>
          <td class="px-4 py-4 text-center">
              <span class="px-2.5 py-1 rounded-full bg-red-50 text-xs font-medium text-red-600 border border-red-100" *ngIf="a.alertaActiva">
                Activa
              </span>
            <span class="px-2.5 py-1 rounded-full bg-slate-100 text-xs font-medium text-slate-500" *ngIf="!a.alertaActiva">
                Inactiva
              </span>
          </td>
          <td class="px-5 md:px-6 py-4 text-right">
            <button class="text-xs text-accent hover:underline font-medium">Ver Detalle</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
