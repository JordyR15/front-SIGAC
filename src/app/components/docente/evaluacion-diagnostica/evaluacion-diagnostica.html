<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Evaluación Diagnóstica Inicial</h2>
    <p class="text-slate-500 text-sm mt-1">Registra resultados de la evaluación inicial.</p>
  </div>

  <section class="glass-card rounded-2xl p-6">
    <form (ngSubmit)="registrar()">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
          <tr class="text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-200">
            <th class="text-left font-semibold px-4 py-2">Estudiante</th>
            <th class="text-right font-semibold px-4 py-2">Calificación</th>
            <th class="text-left font-semibold px-4 py-2">Observaciones</th>
          </tr>
          </thead>
          <tbody class="divide-y divide-slate-200">
          <tr *ngFor="let e of diagnostico.estudiantes">
            <td class="px-4 py-3 font-medium text-slate-900">{{ e.nombre }}</td>
            <td class="px-4 py-3">
              <input type="number" step="0.1" [(ngModel)]="e.calificacion" [name]="'cal_' + e.nombre" class="w-20 px-3 py-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900 text-right" />
            </td>
            <td class="px-4 py-3">
              <input type="text" [(ngModel)]="e.observacion" [name]="'obs_' + e.nombre" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900" />
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <button type="submit" class="mt-6 py-3 px-6 bg-accent hover:bg-accent-dim text-white font-bold rounded-xl shadow-lg shadow-accent/20">Registrar Diagnóstico</button>
    </form>
  </section>
</div>
