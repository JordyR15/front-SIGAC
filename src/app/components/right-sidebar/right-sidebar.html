<aside class="w-full bg-white flex flex-col shrink-0 z-20 relative">
  <div class="h-[72px] flex items-center px-6 shrink-0 border-b border-slate-200">
    <h2 class="text-sm font-semibold text-slate-900">Agenda Próxima</h2>
  </div>
  <div class="flex-1 overflow-y-auto p-5 space-y-7">

    <!-- TAREAS PENDIENTES -->
    <div>
      <h3 class="text-xs font-semibold tracking-wider text-slate-400 uppercase mb-3">Tareas Pendientes</h3>
      <div class="space-y-3">
        <div *ngFor="let tarea of tareasPendientes" class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <p class="text-sm font-semibold text-slate-900">{{ tarea.titulo }}</p>
          <p class="text-[11px] text-slate-500 mt-0.5">{{ tarea.descripcion }}</p>
          <div class="flex items-center gap-1.5 mt-2 text-[11px] font-bold text-amber-600">
            <i class="fa-solid fa-clock"></i> Entrega: {{ tarea.fechaEntrega }}
          </div>
        </div>
      </div>
    </div>

    <!-- RECURSOS ESENCIALES -->
    <div>
      <h3 class="text-xs font-semibold tracking-wider text-slate-400 uppercase mb-3">Recursos Esenciales</h3>
      <div class="space-y-3">
        <div *ngFor="let recurso of recursosEsenciales" class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-slate-900">{{ recurso.titulo }}</p>
            <p class="text-[11px] text-slate-500 mt-0.5">{{ recurso.descripcion }}</p>
          </div>
          <button (click)="marcarComoVisto(recurso.id)"
                  class="w-8 h-8 rounded-full flex items-center justify-center transition-colors"
                  [ngClass]="recurso.visto ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-400 hover:bg-accent/10 hover:text-accent'">
            <i class="fa-solid" [ngClass]="recurso.visto ? 'fa-check' : 'fa-eye'"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- PRÓXIMAS CLASES -->
    <div>
      <h3 class="text-xs font-semibold tracking-wider text-slate-400 uppercase mb-3">Próximas Clases</h3>
      <div class="space-y-3">
        <div *ngFor="let clase of proximasClases" class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
          <p class="text-sm font-semibold text-slate-900">{{ clase.titulo }}</p>
          <p class="text-[11px] text-slate-500 mt-0.5">{{ clase.app }} - {{ clase.fecha }}</p>
          <a [href]="clase.link" target="_blank" class="text-xs text-accent hover:underline mt-2 inline-block">Unirse a la clase</a>
        </div>
      </div>
    </div>
  </div>
</aside>
