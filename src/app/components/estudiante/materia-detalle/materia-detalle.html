<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">Detalle de Materia</h2>
      <p class="text-slate-500 text-sm mt-1">Explora los recursos organizados por temas.</p>
    </div>
    <a routerLink="/estudiante/materias" class="text-sm text-accent hover:underline">← Volver a Materias</a>
  </div>

  <!-- VISOR DE TEMAS CON FLECHAS -->
  <div class="glass-card rounded-2xl p-6 border border-slate-200">
    <!-- Cabecera del tema con navegación -->
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-lg font-bold text-slate-900">
        {{ temas[indiceTemaActual].nombre }}
        <span class="text-sm font-normal text-slate-400 ml-2">
          ({{ indiceTemaActual + 1 }} de {{ temas.length }})
        </span>
      </h3>
      <div class="flex items-center gap-2">
        <button (click)="irAlTemaAnterior()"
                [disabled]="indiceTemaActual === 0"
                class="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center hover:bg-slate-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button (click)="irAlTemaSiguiente()"
                [disabled]="indiceTemaActual === temas.length - 1"
                class="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center hover:bg-slate-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>

    <!-- Recursos del tema actual -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div *ngFor="let recurso of temas[indiceTemaActual].recursos"
           class="border border-slate-200 rounded-xl p-4 flex items-center gap-4 hover:shadow-md transition-all">
        <!-- Icono según tipo de recurso -->
        <div class="w-10 h-10 rounded-lg bg-accent/5 flex items-center justify-center text-accent shrink-0">
          <i [class]="getIconoRecurso(recurso.tipo)"></i>
        </div>
        <div class="flex-1">
          <p class="text-sm font-medium text-slate-900">{{ recurso.titulo }}</p>
          <p class="text-xs text-slate-500 mt-1">{{ recurso.descripcion }}</p>
          <a [href]="recurso.url" target="_blank" class="text-xs text-accent hover:underline mt-2 inline-block">Ver recurso</a>
        </div>
        <span *ngIf="recurso.esEsencial"
              class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-full border border-amber-200 shrink-0">
          Esencial
        </span>
      </div>
    </div>
  </div>
</div>
