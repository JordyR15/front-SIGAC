<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Informe Mensual</h2>
    <p class="text-slate-500 text-sm mt-1">Selecciona el periodo para generar tu informe de actividades.</p>
  </div>

  <section class="glass-card rounded-2xl p-6 max-w-2xl">
    <form (ngSubmit)="generarInforme()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Ayudantía</label>
        <select [(ngModel)]="filtro.ayudantiaId" name="ayudantiaId" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900">
          <option [value]="0">Selecciona una ayudantía...</option>
          <option *ngFor="let a of ayudantias" [value]="a.id">{{ a.nombre }}</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Mes</label>
          <select [(ngModel)]="filtro.mes" name="mes" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900">
            <option [value]="1">Enero</option>
            <option [value]="2">Febrero</option>
            <option [value]="3">Marzo</option>
            <option [value]="4">Abril</option>
            <option [value]="5">Mayo</option>
            <option [value]="6">Junio</option>
            <option [value]="7">Julio</option>
            <option [value]="8">Agosto</option>
            <option [value]="9">Septiembre</option>
            <option [value]="10">Octubre</option>
            <option [value]="11">Noviembre</option>
            <option [value]="12">Diciembre</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Año</label>
          <input type="number" [(ngModel)]="filtro.anio" name="anio" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900" />
        </div>
      </div>

      <button type="submit" class="py-3 px-6 bg-accent hover:bg-accent-dim text-white font-bold rounded-xl shadow-lg shadow-accent/20 transition-all transform hover:-translate-y-0.5">
        Generar Informe
      </button>
    </form>

    <!-- Resultado del Informe (Mock para visualización) -->
    <div class="mt-8 border-t border-slate-200 pt-6" *ngIf="actividadesMock.length > 0">
      <h3 class="text-sm font-semibold text-slate-900 mb-4">Actividades Registradas</h3>
      <div class="space-y-3">
        <div *ngFor="let act of actividadesMock" class="border border-slate-200 rounded-xl p-4">
          <div class="flex items-center justify-between">
            <p class="text-sm font-medium text-slate-900">{{ act.actividadesRealizadas }}</p>
            <span class="text-xs text-slate-500">{{ act.fecha }}</span>
          </div>
          <a href="#" class="text-xs text-accent hover:underline mt-1 inline-block">Ver evidencia</a>
        </div>
      </div>
    </div>
  </section>
</div>
