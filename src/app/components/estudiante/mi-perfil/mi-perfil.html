<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Mi Perfil</h2>
    <p class="text-slate-500 text-sm mt-1">Gestiona tu información personal y académica.</p>
  </div>

  <section class="glass-card rounded-2xl p-6 max-w-2xl">
    <!-- Información del Estudiante -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Usuario</label>
        <input type="text" [(ngModel)]="perfil.username" name="username" disabled class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-500 cursor-not-allowed" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Rol</label>
        <input type="text" [value]="perfil.rol" disabled class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-500 cursor-not-allowed" />
      </div>
    </div>

    <form (ngSubmit)="guardarCambios()" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Nombre</label>
          <input type="text" [(ngModel)]="perfil.nombre" name="nombre" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Apellido</label>
          <input type="text" [(ngModel)]="perfil.apellido" name="apellido" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Correo Institucional</label>
        <input type="email" [(ngModel)]="perfil.correo" name="correo" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900" />
      </div>

      <div class="border-t border-slate-200 pt-6">
        <h3 class="text-sm font-semibold text-slate-900 mb-4">Información Académica</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Semestre Actual</label>
            <input type="text" [value]="perfil.semestre" disabled class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-500 cursor-not-allowed" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Créditos Aprobados</label>
            <input type="text" [value]="perfil.creditosAprobados" disabled class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-500 cursor-not-allowed" />
          </div>
        </div>
      </div>

      <button type="submit" class="py-3 px-6 bg-accent hover:bg-accent-dim text-white font-bold rounded-xl shadow-lg shadow-accent/20 transition-all transform hover:-translate-y-0.5">
        Guardar Cambios
      </button>
    </form>
  </section>
</div>
