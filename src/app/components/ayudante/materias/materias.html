<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Mis Materias (Ayudante)</h2>
    <p class="text-slate-500 text-sm mt-1">Gestiona los recursos y actividades de tus materias.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let materia of materias"
         class="glass-card rounded-2xl p-6 border border-slate-200 hover:shadow-lg transition-all cursor-pointer group"
         [routerLink]="['/ayudante/materia', materia.id]">
      <div class="w-12 h-12 rounded-xl bg-accent/10 flex items-center justify-center text-accent mb-4 group-hover:scale-110 transition-transform">
        <i class="fa-solid fa-book-open text-xl"></i>
      </div>
      <div>
        <h3 class="text-lg font-bold text-slate-900">{{ materia.nombre }}</h3>
        <p class="text-xs text-slate-400 font-mono mt-1">{{ materia.codigo }}</p>
        <div class="flex items-center gap-2 mt-2 text-xs text-slate-500">
          <i class="fa-regular fa-user"></i>
          <span>{{ materia.docente }}</span>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-slate-200 flex gap-2">
        <button (click)="agregarRecurso(materia.id)" class="flex-1 py-1.5 px-3 bg-accent text-white text-xs font-medium rounded-lg hover:bg-accent-dim transition-colors">
          <i class="fa-solid fa-plus mr-1"></i> Recurso
        </button>
        <button class="flex-1 py-1.5 px-3 bg-slate-100 text-slate-700 text-xs font-medium rounded-lg hover:bg-slate-200 transition-colors">
          <i class="fa-regular fa-pen-to-square mr-1"></i> Actividad
        </button>
      </div>
    </div>
  </div>
</div>
