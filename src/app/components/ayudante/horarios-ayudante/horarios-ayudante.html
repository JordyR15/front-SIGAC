<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Horarios Disponibles</h2>
    <p class="text-slate-500 text-sm mt-1">Selecciona un bloque de horas consecutivas para crear una nueva clase.</p>
  </div>

  <div class="glass-card rounded-2xl overflow-hidden p-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Lista de días y horas -->
      <div>
        <h3 class="text-sm font-semibold text-slate-900 mb-4">Horas Disponibles</h3>
        <div *ngFor="let dia of dias" class="mb-4">
          <p class="text-xs font-bold text-slate-600 uppercase mb-2">{{ dia }}</p>
          <div class="flex flex-wrap gap-2">
            <button *ngFor="let hora of horas"
                    (click)="toggleHora(hora)"
                    [disabled]="isHoraOcupada(hora, dia)"
                    class="px-3 py-1.5 rounded-lg text-xs font-medium transition-colors border"
                    [ngClass]="{
                      'bg-red-100 text-red-600 border-red-200 cursor-not-allowed': isHoraOcupada(hora, dia),
                      'bg-accent text-white border-accent': isHoraSeleccionada(hora),
                      'bg-white text-slate-600 border-slate-200 hover:bg-slate-50': !isHoraOcupada(hora, dia) && !isHoraSeleccionada(hora)
                    }">
              {{ hora }}
            </button>
          </div>
        </div>
      </div>

      <!-- Resumen y botón de crear -->
      <div class="bg-slate-50 rounded-xl p-6">
        <h3 class="text-sm font-semibold text-slate-900 mb-4">Resumen</h3>
        <div *ngIf="horasSeleccionadas.length > 0">
          <p class="text-sm text-slate-600">Has seleccionado: <span class="font-bold text-slate-900">{{ horasSeleccionadas.join(' - ') }}</span></p>
          <p class="text-xs text-slate-500 mt-1">Duración: {{ horasSeleccionadas.length }} hora(s)</p>
          <button (click)="crearClase()" class="mt-4 w-full py-2 bg-accent text-white rounded-lg hover:bg-accent-dim transition-colors font-medium">
            Crear Clase
          </button>
        </div>
        <div *ngIf="horasSeleccionadas.length === 0" class="text-sm text-slate-400 italic py-4">
          Selecciona horas consecutivas para formar una clase.
        </div>
      </div>
    </div>
  </div>
</div>
