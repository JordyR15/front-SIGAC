<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Asignación de Ayudantes</h2>
    <p class="text-slate-500 text-sm mt-1">Asigna estudiantes aprobados a una cátedra.</p>
  </div>

  <section class="glass-card rounded-2xl p-6 max-w-2xl">
    <form (ngSubmit)="asignar()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">ID de la Solicitud (Ayudantía)</label>
        <input type="number" [(ngModel)]="asignacion.ayudantiaId" name="ayudantiaId" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900" placeholder="Ej: 1" />
      </div>
      <button type="submit" class="py-3 px-6 bg-accent hover:bg-accent-dim text-white font-bold rounded-xl shadow-lg shadow-accent/20">Asignar Ayudante</button>
    </form>
  </section>
</div>
