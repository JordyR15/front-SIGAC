<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Crear Nueva Materia</h2>
    <p class="text-slate-500 text-sm mt-1">Registra una nueva materia y asígnale un docente responsable.</p>
  </div>

  <section class="glass-card rounded-2xl p-6 border border-slate-200">
    <form (ngSubmit)="guardarMateria()" class="space-y-4">

      <!-- Nombre -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre de la Materia</label>
        <input type="text" [(ngModel)]="nuevaMateria.nombre" name="nombre" required placeholder="Ej: Cálculo Avanzado" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white" />
      </div>

      <!-- Código -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Código</label>
        <input type="text" [(ngModel)]="nuevaMateria.codigo" name="codigo" required placeholder="Ej: MAT-301" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white" />
      </div>

      <!-- Descripción -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label>
        <textarea [(ngModel)]="nuevaMateria.descripcion" name="descripcion" rows="3" placeholder="Breve descripción de la materia..." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white"></textarea>
      </div>

      <!-- Docente Responsable -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Docente Responsable</label>
        <select [(ngModel)]="nuevaMateria.docenteResponsableId" name="docenteResponsableId" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white">
          <option [value]="0">Selecciona un docente...</option>
          <option *ngFor="let d of docentes" [value]="d.id">{{ d.nombre }}</option>
        </select>
      </div>

      <button type="submit" class="py-2 px-6 bg-accent hover:bg-accent-dim text-white font-medium rounded-lg transition-colors">
        Crear Materia
      </button>
    </form>
  </section>
</div>
