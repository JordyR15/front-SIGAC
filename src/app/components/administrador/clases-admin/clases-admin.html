<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">Clases Registradas</h2>
      <p class="text-slate-500 text-sm mt-1">Gestiona las clases y sus materias asociadas.</p>
    </div>
    <a routerLink="/admin/crear-clase" class="py-2 px-4 bg-accent text-white rounded-lg hover:bg-accent-dim transition-colors text-sm font-medium">
      <i class="fa-solid fa-plus mr-1"></i> Crear Clase
    </a>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let c of clases" class="glass-card rounded-2xl p-6 border border-slate-200 hover:shadow-lg transition-all cursor-pointer group">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-lg font-bold text-slate-900">{{ c.nombre }}</h3>
        <span class="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">{{ c.semestre }}</span>
      </div>

      <div class="space-y-2">
        <p class="text-xs font-semibold text-slate-500 uppercase mb-1">Materias</p>
        <div *ngFor="let m of c.materias" class="flex items-center justify-between text-sm border-b border-slate-100 py-1 last:border-0">
          <span class="font-medium text-slate-800">{{ m.nombre }}</span>
          <span class="text-xs text-slate-400">{{ m.codigo }}</span>
        </div>
      </div>

      <div class="mt-4 pt-3 border-t border-slate-200 flex gap-2">
        <button class="text-xs text-accent hover:underline">Añadir materia</button>
        <button class="text-xs text-slate-500 hover:text-accent ml-auto">Ver horarios</button>
      </div>
    </div>
  </div>
</div>
