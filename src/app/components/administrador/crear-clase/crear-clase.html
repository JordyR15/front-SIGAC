<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Crear Nueva Clase</h2>
    <p class="text-slate-500 text-sm mt-1">Registra un nuevo grupo académico (ej: Ingeniería de Software 2026-2).</p>
  </div>

  <section class="glass-card rounded-2xl p-6 border border-slate-200">
    <form (ngSubmit)="guardarClase()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nombre de la Clase</label>
        <input type="text" [(ngModel)]="nuevaClase.nombre" name="nombre" required placeholder="Ej: Ingeniería de Software 2026-2" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Semestre</label>
        <input type="text" [(ngModel)]="nuevaClase.semestre" name="semestre" required placeholder="Ej: 2026-2" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Descripción (opcional)</label>
        <textarea [(ngModel)]="nuevaClase.descripcion" name="descripcion" rows="3" placeholder="Descripción general..." class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white"></textarea>
      </div>

      <button type="submit" class="py-2 px-6 bg-accent hover:bg-accent-dim text-white font-medium rounded-lg transition-colors">
        Crear Clase
      </button>
    </form>
  </section>
</div>
